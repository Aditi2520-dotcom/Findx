<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FindX - Discover Jharkhand</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    /* CSS Variables for a light, professional theme */
    :root {
      --text-color: #030d18;
      --text-light: #6c757d;
      --accent-color: #6c757d;
      --accent-dark: #000000;
      --accent-gradient: linear-gradient(45deg, #48bcae, #3b9d90);
      --background-color: #f8f9fa;
      --surface-color: #ffffff;
      --border-color: #dee2e6;
      --shadow-color: rgba(0, 0, 0, 0.075);
      --accent-shadow-color: rgba(72, 188, 174, 0.3);
      --font-body: 'Poppins', sans-serif;
      --font-display: 'Playfair Display', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior:auto;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--background-color);
      color: var(--text-color);
    }

    /* Animation Keyframes */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Hero Section */
    .hero-section {
      min-height: 55vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--surface-color);
      padding: 40px 20px;
      background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/Netarhat_Jharkhand.jpg/1920px-Netarhat_Jharkhand.jpg');
      background-size: cover;
      background-position: center;
    }

    .hero-content {
      animation: fadeInUp 1s ease-out;
    }

    .hero-section h1 {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 5vw, 4rem); /* Responsive font size */
      text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
      margin-bottom: 1rem;
    }
    
    .hero-section .tagline {
        font-size: 1.25rem;
        font-weight: 400;
        opacity: 0.9;
        margin-bottom: 2rem;
    }

    .search-container {
      width: 100%;
      max-width: 500px;
    }

    .search-container input[type="text"] {
      width: 100%;
      padding: 18px 25px;
      font-size: 1.1rem;
      font-family: var(--font-body);
      border: 1px solid var(--border-color);
      border-radius: 50px;
      background-color: var(--surface-color);
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .search-container input[type="text"]:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 4px rgba(72, 188, 174, 0.25);
    }

    /* Main Content Area */
    main {
      padding: 60px 20px;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeInUp 1s ease-out 0.3s;
      animation-fill-mode: both; /* Keeps styles after animation */
    }
    
    .section-title {
        font-family: var(--font-display);
        font-size: 2.5rem;
        margin-bottom: 2rem;
        text-align: center;
    }

    /* Carousel Styling */
    .carousel-container {
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
    }

    .carousel-button {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      color: var(--text-light);
      font-size: 1.5rem;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
      user-select: none;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px var(--shadow-color);
      z-index: 5;
    }
    
    .carousel-button:hover {
      background-color: var(--accent-color);
      color: var(--surface-color);
      border-color: var(--accent-color);
      transform: scale(1.1);
    }

    #btnLeft { margin-right: -25px; }
    #btnRight { margin-left: -25px; }

    .carousel {
      overflow-x: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      display: flex;
      gap: 25px;
      padding: 20px;
      margin: 0 10px;
      scrollbar-width: none;
    }

    .carousel::-webkit-scrollbar { display: none; }

    .carousel img {
      flex: 0 0 auto;
      width: 250px;
      height: 170px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      user-select: none;
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .carousel img:hover {
        transform: translateY(-8px) scale(1.03);
        box-shadow: 0 12px 20px rgba(0,0,0,0.15);
        filter: brightness(1.05);
    }

    /* Footer Styling */
    footer {
      background-color: var(--surface-color);
      padding: 25px 0;
      display: flex;
      justify-content: center;
      gap: 30px;
      border-top: 1px solid var(--border-color);
      box-shadow: 0 -4px 10px var(--shadow-color);
    }

    footer button {
      background-color: var(--surface-color);
      border: 2px solid var(--border-color);
      width: 65px;
      height: 65px;
      border-radius: 50%;
      color: var(--accent-color);
      font-size: 1.6rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.4s ease;
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    
    footer button:hover {
      border-color: transparent;
      transform: translateY(-8px) scale(1.05);
      box-shadow: 0 10px 20px var(--accent-shadow-color);
      color: var(--surface-color);
    }

    footer button::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--accent-gradient);
      z-index: -1;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    footer button:hover::before {
      opacity: 1;
    }
  </style>
</head>
<body>

<section class="hero-section">
  <div class="hero-content">
    <h1>Discover Jharkhand</h1>
    <p class="tagline">The Land of Forests</p>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search for places, events, and more..." />
    </div>
  </div>
</section>

<main>
  <h2 class="section-title">Explore The Region</h2>
  <div class="carousel-container">
    <button class="carousel-button" id="btnLeft" aria-label="Scroll Left"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="carousel" id="imageCarousel" tabindex="0">
 <img src=" 62168df6a34d083d91d91418c4ce1b39.jpg   " alt="Falls in Jharkhand">
      <img src="288f3163f41d994d6c965b1979b3de5c.jpg   " alt="Baidyanath Temple in Deoghar" />
      <img src=" 26dff6dd6d3d68c8bbf3556810f31f88.jpg  " alt="Tagore Hill in Ranchi" />
      <img src=" 8aa9d4b203c9a512480bc3e70d6a5837.jpg " alt="Jubilee Park in Jamshedpur" />
      <img src=" 0bd762cfcbef4ce2eb65303abb50c8f5.jpg" alt="Hundru Falls near Ranchi" />
    </div>
    <button class="carousel-button" id="btnRight" aria-label="Scroll Right"><i class="fa-solid fa-chevron-right"></i></button>
  </div>
</main>

<footer>
 <a href="3.html">
 <button title="Location"><i class="fa-solid fa-location-dot"></i></button>
</a>
  <a href="4.html"><button title="Chat AI"><i class="fa-solid fa-comment-dots"></i></button>
</a>   
  <a href="2.html">
    <button title="Sports"><i class="fa-solid fa-basketball"></i></button>
  </a>
  
  <a href="5.html"><button title="Groups"><i class="fa-solid fa-users"></i></button></a>
  <a href="6.html"><button title="Guides"><i class="fa-solid fa-book-open"></i></button></a>
</footer>

<script>
  const carousel = document.getElementById('imageCarousel');
  const btnLeft = document.getElementById('btnLeft');
  const btnRight = document.getElementById('btnRight');

  // Dynamic scroll amount calculation
  const calculateScrollAmount = () => {
    const firstImage = carousel.querySelector('img');
    if (!firstImage) return 275;

    const carouselStyle = window.getComputedStyle(carousel);
    const imageWidth = firstImage.clientWidth;
    const gap = parseFloat(carouselStyle.gap) || 25;
    
    return imageWidth + gap;
  };

  btnLeft.addEventListener('click', () => {
    carousel.scrollBy({ left: -calculateScrollAmount(), behavior: 'smooth' });
  });

  btnRight.addEventListener('click', () => {
    carousel.scrollBy({ left: calculateScrollAmount(), behavior: 'smooth' });
  });

  carousel.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') {
      e.preventDefault();
      carousel.scrollBy({ left: -calculateScrollAmount(), behavior: 'smooth' });
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      carousel.scrollBy({ left: calculateScrollAmount(), behavior: 'smooth' });
    }
  });
</script>

</body>
</html>
